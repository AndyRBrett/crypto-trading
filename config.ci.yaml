# Config for the scheduled GitHub Actions run ("always-on" hosting).
#
# This is what the cloud bot uses (bot/main.py --config config.ci.yaml). It is
# committed to the repo on purpose, so keep ONLY non-secret settings here.
# Secrets (ANTHROPIC_API_KEY, the GitHub token) come from Actions secrets/env,
# never from this file. Your local config.yaml stays separate and gitignored.

# Trade on the DAILY timeframe. Backtests over multiple years show simple TA only
# clears trading fees on daily candles — hourly trades ~5x more often and bleeds
# the (small) edge to fees. Entries fire on settled daily bars; the bot still
# polls hourly so protective stops react to price intraday.
candle_granularity: ONE_DAY
# 300 candles so the 200-period trend filter has enough history (~10 months daily).
candle_count: 300

# Shared strategy defaults. Each account below inherits these and overrides as
# needed. (Top-level `products`/`strategy` are only used if `accounts` is omitted.)
strategy:
  fast_period: 20
  slow_period: 50
  ma_type: ema
  rsi_period: 14
  rsi_overbought: 85   # 70 over-blocks entries in trends (daily sweep favors 85+)
  rsi_oversold: 30
  trend_filter: true
  trend_period: 200
  adx_filter: true
  adx_period: 14
  adx_min: 20
  atr_period: 14
  sentiment_buy_veto: -0.4
  sentiment_sell_trigger: -0.6
  donchian_period: 20
  donchian_exit_period: 10
  rsi_mr_oversold: 30
  rsi_mr_overbought: 55

# Three paper accounts, each running a different strategy. Each keeps its own
# portfolio in trading.<name>.db (shared to the bot-state branch).
accounts:
  - name: trend
    strategy_type: ema_crossover
    products: [BTC-USD, ETH-USD]
    starting_cash: 10000

  - name: mean_reversion
    strategy_type: rsi_mean_reversion
    products: [BTC-USD, SOL-USD]
    starting_cash: 10000

  - name: breakout
    strategy_type: donchian_breakout
    products: [ETH-USD, SOL-USD]
    starting_cash: 10000
    strategy:
      # Issue #41: prior-close +/- prior-ATR bands tighten in quiet markets and
      # widen in volatile ones. Start at one ATR on each side; review the raw
      # versus normalized proximity telemetry before tuning these multipliers.
      adaptive_breakout: true
      breakout_atr_mult: 1.0
      exit_atr_mult: 1.0

  # Symmetric trend follower that can SHORT confirmed downtrends — the only
  # sleeve that can make money while the market falls (instead of sitting in
  # cash like the long-only accounts). Inherits the default ATR stops/targets.
  - name: long_short
    strategy_type: trend_long_short
    products: [BTC-USD, ETH-USD]
    starting_cash: 10000
    allow_short: true
    strategy:
      # Mirror of the long side's rsi_overbought: 85 — a strong downtrend pins
      # RSI low, so a high oversold floor (30) would block shorts exactly when
      # the trend is strongest. 15 only stands aside at a washed-out extreme.
      rsi_oversold: 15

  # Stay-invested regime filter: hold a long while price is above the 200-day
  # trend MA (capturing the bull-market upside the tactical accounts give up),
  # move to cash on a break below it. Sized to the equity cap and given wide
  # "disaster only" stops so it holds through ordinary pullbacks — the routine
  # exit is the regime break, not an ATR stop.
  - name: regime
    strategy_type: regime
    products: [BTC-USD, ETH-USD]
    starting_cash: 10000
    # This sleeve exists to HOLD through the bull market — a 21-day aging cap
    # would rotate it out of exactly the multi-month run it is meant to ride.
    # Its exit is the regime break (price below the 200-day MA), not a clock.
    max_hold_days: 0
    # It is also the ONE sleeve the vol-target bound actually binds on (the
    # tactical sleeves hit their risk bound long before the equity cap). At the
    # shared 20% target it would size a stay-invested account to ~40% of equity,
    # which defeats the point of the sleeve. A 60% target keeps it effectively
    # fully invested in normal conditions and only trims genuinely wild assets.
    vol_target_pct: 0.60
    risk_per_trade_pct: 0.95
    max_position_pct: 0.95
    stop_loss_atr_mult: 10
    take_profit_atr_mult: 1000
    trailing_stop: false
    fallback_stop_pct: 0.5

  # Cross-sectional momentum rotation: rank the universe by trailing 90-bar
  # return, hold ONLY the leader and only while it trades above its own
  # 200-bar trend MA AND its 90-bar return is positive — otherwise cash (a
  # leader that is merely the least-bad loser is not bought). A relative-
  # strength mechanism, unlike the per-asset time-series rules above. NOT
  # enabled by default; uncomment to run it as a sixth paper account. NOTE:
  # multi-year backtest validation is still outstanding (the backtester is
  # single-instrument). See ENABLING.md before turning this on.
  # - name: rotation
  #   strategy_type: momentum_rotation
  #   products: [BTC-USD, ETH-USD, SOL-USD]
  #   starting_cash: 10000
  #   risk_per_trade_pct: 0.95   # size to the cap like the regime account
  #   max_position_pct: 0.95
  #   stop_loss_atr_mult: 10     # wide disaster stop; rotation is the exit
  #   take_profit_atr_mult: 1000
  #   trailing_stop: false
  #   fallback_stop_pct: 0.5
  #   max_hold_days: 0           # rotation is the exit; a clock would fight it
  #   strategy:
  #     rotation_lookback_bars: 90

# Risk management: volatility-based sizing and protective exits.
risk_per_trade_pct: 0.01
max_position_pct: 0.30
max_open_positions: 3
stop_loss_atr_mult: 2.0
take_profit_atr_mult: 6.0   # 3:1 reward:risk; daily sweep favors wider targets
trailing_stop: true
fallback_stop_pct: 0.08
# Post-stop-out re-entry cooldown (bars). OFF (0) = current behavior; set to
# e.g. 1 to make a product sit out one daily bar after a protective stop
# before a new entry is allowed (stops the stop-out -> instant-re-entry
# whipsaw seen on long_short 2026-07-02).
reentry_cooldown_bars: 0

# Volatility-targeted sizing: OFF = sizing exactly as before. Enable to bound a
# new position's notional by its expected annualized volatility contribution
# (vol_target_pct of equity), so a high-vol asset stops taking the same notional
# as a calm one just because the flat 30% equity cap allowed it. Only ever
# reduces size; max_position_pct stays the backstop.
vol_target_enabled: true
vol_target_pct: 0.20
vol_lookback_bars: 20

# Position aging / rotation cap: 0 = off (positions are held until a stop,
# target, or strategy exit fires). Set to e.g. 21 to close any position held
# longer than 21 days that isn't up at least max_hold_min_gain_pct, so a stale
# hold stops blocking fresh signals with `in_position`.
max_hold_days: 21
max_hold_min_gain_pct: 0.02

# Transaction-cost gate: OFF = measure only (every entry candidate's projected
# move, its round-trip cost, and the gap between them are written to the signal
# log's features.cost_floor). Enable to veto entries whose take-profit distance
# doesn't cover round-trip fees + median recent slippage times the margin.
# Rejections appear as `below_cost_floor`. Never blocks exits.
cost_floor_enabled: true
cost_floor_margin: 1.5
cost_floor_samples: 20

# Rolling-risk circuit breaker: OFF = no throttle (the state is still computed
# each tick and reported in overseer-status.json when tripped). Enable to size
# new entries at risk_breaker_size_mult while trailing Sharpe AND Sortino stay
# at or below their floors for risk_breaker_days consecutive days; 0.0 pauses
# entries outright. Clears itself on recovery. Never blocks exits.
risk_breaker_enabled: true
risk_breaker_days: 3
risk_breaker_size_mult: 0.5   # halve, don't pause: a paused book earns nothing back
risk_breaker_sharpe_floor: -1.5
risk_breaker_sortino_floor: -1.5

# Cross-account exposure guard: OFF = read-only (combined gross/net exposure
# is still computed and logged each tick). Enable to veto new entries that
# would push combined gross exposure over max_gross_exposure_pct x combined
# equity across all five accounts. Never blocks exits.
portfolio_guard_enabled: false
max_gross_exposure_pct: 1.5

# Correlation/concentration guard (#42): cap a single asset at 50% of combined
# equity and correlation-adjusted gross exposure at 80%. Missing or stale
# return history receives no diversification credit. Long and short entries
# count positively; exits and protective stops are always allowed.
correlation_guard_enabled: true
correlation_lookback: 60
correlation_min_samples: 20
correlation_cluster_threshold: 0.8
max_asset_exposure_pct: 0.5
max_correlated_exposure_pct: 0.8

# News sentiment (needs the ANTHROPIC_API_KEY Actions secret; safe no-op without).
# When the secret is missing the bot logs a warning each tick and reports it in
# overseer-status.json errors, so "enabled but inert" can't sit unnoticed.
sentiment_enabled: true

# Push notifications. Alert on every closed round trip (win AND loss) so a
# losing streak isn't silent, plus a weekly heartbeat so a bot sitting in cash
# is distinguishable from a dead one. Needs the VAPID_PRIVATE_KEY and
# PUSH_SUBSCRIPTION Actions secrets; a safe no-op without them.
notify_on_loss: true
heartbeat_days: 7

# Publish state.json to the gh-pages branch so the dashboard updates.
publish_enabled: true
publish_repo: AndyRBrett/crypto-trading
publish_branch: gh-pages
publish_path: state.json

# Driver coordination: stand down while the laptop is actively driving, and
# share one continuous portfolio (trading.db on the bot-state branch).
coordinate_enabled: true
driver_role: cloud
lease_ttl_seconds: 1800
