# Pinning every action to a commit SHA (see the `# vN` comments in the
# workflows) stops a moved tag from silently changing what runs in jobs that
# hold this repo's secrets and a contents: write token. The cost is that a pin
# never picks up an upstream security fix on its own — so this keeps them
# moving, as a reviewable PR rather than a silent swap. Dependabot reads the
# `# vN` comment and preserves it when it bumps the SHA.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
