# Drop-in implementer for a project the overseer reviews.
#
# Copy this to .github/workflows/implement.yml IN YOUR PROJECT REPO (not in the
# overseer). It listens for the `overseer-implement` dispatch that the overseer
# fires at issues its review pipeline filed, implements one, and opens a pull
# request. It never merges anything.
#
# WHY IT LIVES IN YOUR REPO. The agent needs your tests, your dependencies and
# your conventions. Running it from the overseer's runner would mean installing
# four unrelated codebases there and re-inventing four CI setups that already
# work — and would need one cross-repo token with contents: write on everything.
# This way each repo keeps its own key and its own blast radius.
#
# SETUP: already done for this repo.
#   - Toolchain below mirrors ci.yml (Python 3.11 + requirements.txt).
#   - The prompt names this repo's test command (python -m pytest -q).
#   - ANTHROPIC_API_KEY secret and the "Allow GitHub Actions to create and
#     approve pull requests" setting are both in place.
#   - OVERSEER_GITHUB_TOKEN carries Actions: write on this repo, which is what
#     lets the overseer's dispatch reach this workflow.
#
# NOTE ON CI: a pull request opened with the built-in GITHUB_TOKEN does not
# trigger this repo's other workflows, so your normal PR checks will not run on
# it. That is why the agent is told to run the suite itself before opening one.
# To get CI on these PRs too, pass a PAT as `github_token` below instead.

name: Implement a filed issue

on:
  repository_dispatch:
    types: [overseer-implement]
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue number to implement"
        required: true
        type: string
      tier:
        description: "Model tier for this attempt"
        type: choice
        default: light
        options: [light, heavy]
        required: false

permissions:
  contents: write        # push the branch
  pull-requests: write   # open the PR
  issues: write          # comment when the issue can't be implemented

concurrency:
  group: implement-${{ github.event.client_payload.issue || inputs.issue }}
  cancel-in-progress: false

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # The dispatch payload arrives over the API, so it is input, not fact.
      # Only the issue number is used, and only once it is proved to be a number;
      # the agent reads the issue itself. Interpolating a payload-supplied title
      # into the prompt would let whoever can fire a dispatch write that prompt.
      - name: Validate the issue number
        id: issue
        env:
          RAW: ${{ github.event.client_payload.issue || inputs.issue }}
        run: |
          case "$RAW" in
            ''|*[!0-9]*) echo "::error title=Bad dispatch::'$RAW' is not an issue number"; exit 1 ;;
          esac
          echo "number=$RAW" >> "$GITHUB_OUTPUT"

      # Tier NAME in, model id out. The name may come from a repository_dispatch
      # payload — i.e. over the API — and the model is interpolated into the
      # Claude CLI's arguments, so anything not on this list is refused rather
      # than passed through. The model ids themselves come from repo variables,
      # which only someone with write access can set.
      - name: Choose the model tier
        id: model
        env:
          RAW: ${{ github.event.client_payload.tier || inputs.tier }}
          DEFAULT_TIER: ${{ vars.OVERSEER_IMPLEMENT_TIER || 'light' }}
          LIGHT_MODEL: ${{ vars.OVERSEER_IMPLEMENT_MODEL || 'claude-sonnet-5' }}
          HEAVY_MODEL: ${{ vars.OVERSEER_IMPLEMENT_HEAVY_MODEL || 'claude-opus-4-8' }}
        run: |
          tier="${RAW:-$DEFAULT_TIER}"
          case "$tier" in
            light|heavy) ;;
            *) echo "::warning title=Unknown tier::'$tier' is not a tier; using light"; tier=light ;;
          esac
          case "$tier" in
            heavy) model="$HEAVY_MODEL" ;;
            *)     model="$LIGHT_MODEL" ;;
          esac
          echo "tier=$tier"   >> "$GITHUB_OUTPUT"
          echo "model=$model" >> "$GITHUB_OUTPUT"
          echo "Running issue #${{ steps.issue.outputs.number }} on the $tier tier ($model)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the agent branches and pushes

      # Mirrors ci.yml exactly, so the agent builds and tests against the same
      # toolchain that gates this repo's pull requests.
      - name: Set up the project
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Implement it
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Implement GitHub issue #${{ steps.issue.outputs.number }} in this repository.

            1. Read it first: `gh issue view ${{ steps.issue.outputs.number }} --comments`.
               It was filed by Project Overseer's weekly review pipeline and its
               body states the evidence the bug or idea rests on.
            2. Check that evidence against the current code. If the issue is
               already fixed, wrong, or no longer applies, do NOT invent work to
               do — comment on the issue saying exactly that, and stop.
            3. Otherwise make the smallest correct change that resolves it,
               matching the surrounding code's style, naming and comment density.
            4. Add or update tests that cover the change, then run the suite the
               way ci.yml does: `python -m pytest -q`. Never weaken, skip, or
               delete a test to get it green.
            5. With the suite passing, commit on a new branch named
               `overseer/issue-${{ steps.issue.outputs.number }}`, push it, and open a pull
               request with `gh pr create`. The body should say what changed and
               why, note anything you deliberately left out, and end with
               `Closes #${{ steps.issue.outputs.number }}`.
            6. If you cannot get the suite passing, do not open a pull request.
               Comment on the issue with what you tried and what blocked you.

            Scope discipline: only what the issue asks for. No drive-by
            refactors, no dependency bumps, no reformatting untouched code. Never
            merge the pull request and never push to main.

            Budget: you have a limited number of turns. Grep for what you need
            and read the ranges around the hits rather than reading whole files,
            and get to the commit — a finished small change beats a perfect one
            that runs out of turns with nothing pushed.
          # 40 turns was not enough to read an issue, explore a repo, edit, test,
          # commit and open a PR — the first real run died on error_max_turns
          # having pushed nothing. Raise it further for a large codebase; the
          # per-issue cost scales with it.
          claude_args: |
            --max-turns 150
            --model ${{ steps.model.outputs.model }}
            --allowedTools Read,Edit,Write,Glob,Grep,Bash
          # Claude's own report in the run's Step Summary. The SDK output is
          # hidden by default, so without this a failure is a one-line error with
          # no account of what it had done first.
          display_report: true

      # A failed attempt hands the issue BACK. Otherwise it keeps the
      # overseer:implementing label the dispatcher applied, the overseer's gate
      # treats it as in progress forever, and the issue is silently burned — no
      # PR, no retry, nothing but a red run.
      #
      # Whose fault it was decides which label it gets back. An attempt that ran
      # out of turns or couldn't get your suite green is benched with
      # overseer:implement-failed until you take the label off, since it will
      # usually fail the same way again. An attempt that died because the
      # Anthropic key ran out of credit says nothing about the issue, so it is
      # handed back clean and picked up again on the next run — otherwise a dry
      # balance would quietly retire every issue attempted while it lasted.
      - name: Hand the issue back on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ steps.issue.outputs.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # The action writes the session result here; a billing failure is
          # reported in it rather than as a distinct exit code.
          report="$RUNNER_TEMP/claude-execution-output.json"
          blameless=""
          if [ -f "$report" ] && grep -qiE 'credit balance is too low|insufficient[ _](credit|quota)|billing' "$report"; then
            blameless=1
          fi

          gh issue edit "$ISSUE" --remove-label "overseer:implementing" || true

          if [ -n "$blameless" ]; then
            echo "::warning title=Out of Anthropic credit::$ISSUE was handed back unbenched; top up and it is picked again next run."
            printf '%s\n\n%s\n\n%s\n\n---\n%s\n' \
              "The overseer's implementer could not run this issue: the Anthropic API key is out of credit. Nothing here reflects on the issue itself." \
              "Run: $RUN_URL" \
              'It stays in the queue and will be picked up again once the balance is topped up.' \
              '_Generated by [Claude Code](https://claude.ai/code)_' > "$RUNNER_TEMP/failed.md"
          else
            gh label create "overseer:implement-failed" --force \
              --color B60205 --description "An overseer implementation attempt failed" || true
            gh issue edit "$ISSUE" --add-label "overseer:implement-failed" || true
            printf '%s\n\n%s\n\n%s\n\n---\n%s\n' \
              "The overseer's implementer attempted this issue and did not finish, so no pull request was opened." \
              "Run: $RUN_URL" \
              'Remove the `overseer:implement-failed` label to put it back in the queue.' \
              '_Generated by [Claude Code](https://claude.ai/code)_' > "$RUNNER_TEMP/failed.md"
          fi
          gh issue comment "$ISSUE" --body-file "$RUNNER_TEMP/failed.md" || true
